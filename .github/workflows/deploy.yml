# Überträgt content/site.json in die Seiten und veröffentlicht auf GitHub Pages.
# Voraussetzung: Settings → Pages → Source: «GitHub Actions».
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website-Daten übernehmen
        run: node scripts/apply-content.mjs
      - name: Seite zusammenstellen
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude content --exclude README.md ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
