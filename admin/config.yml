# Sveltia CMS: Formular für content/site.json.
# Jedes Speichern ist ein Commit auf main; danach baut .github/workflows/deploy.yml die Seite neu.
backend:
  name: github
  repo: Code-Schmiede-GmbH/garage-morina
  branch: main
  # Für «Mit GitHub anmelden» die URL des sveltia-cms-auth Workers eintragen (siehe README).
  # Ohne diese Zeile funktioniert die Anmeldung mit einem persönlichen Zugriffstoken.
  # base_url: https://sveltia-cms-auth.<konto>.workers.dev
  commit_messages:
    update: 'Website-Daten aktualisiert ({{author-name}})'

site_url: https://www.garage-morina.ch
media_folder: assets/img

collections:
  - name: daten
    label: Website-Daten
    editor:
      preview: false
    files:
      - name: site
        label: Öffnungszeiten, Kontakt & Hinweise
        file: content/site.json
        format: json
        fields:
          - name: hours
            label: Öffnungszeiten
            widget: object
            hint: 'Pro Tag ein oder mehrere Zeitfenster im Format 08:00-12:00. Tag ohne Zeitfenster = geschlossen.'
            fields:
              - { name: mon, label: Montag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: tue, label: Dienstag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: wed, label: Mittwoch, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: thu, label: Donnerstag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: fri, label: Freitag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: sat, label: Samstag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }
              - { name: sun, label: Sonntag, widget: list, required: false, field: { name: slot, label: Zeitfenster, widget: string, pattern: ['^\d{1,2}:\d{2}-\d{1,2}:\d{2}$', 'Format 08:00-12:00'] } }

          - name: closure
            label: Betriebsferien
            widget: object
            hint: 'Zeigt einen Hinweisbalken auf allen Seiten und stellt den Status «geöffnet/geschlossen» auf Ferien um.'
            fields:
              - { name: active, label: Betriebsferien anzeigen, widget: boolean, default: false }
              - { name: from, label: Erster Ferientag, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
              - { name: to, label: Letzter Ferientag, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
              - { name: showDaysBefore, label: Hinweis so viele Tage vorher zeigen, widget: number, value_type: int, min: 0, max: 90, default: 14 }
              - { name: text, label: Text im Hinweisbalken, widget: string, required: false }

          - name: season
            label: Reifensaison
            widget: object
            hint: 'Hinweis zum Reifenwechsel in den gewählten Monaten. Betriebsferien haben Vorrang.'
            fields:
              - name: winter
                label: Winterreifen
                widget: object
                fields:
                  - name: months
                    label: Monate
                    widget: select
                    multiple: true
                    required: false
                    options: &months
                      - { label: Januar, value: 1 }
                      - { label: Februar, value: 2 }
                      - { label: März, value: 3 }
                      - { label: April, value: 4 }
                      - { label: Mai, value: 5 }
                      - { label: Juni, value: 6 }
                      - { label: Juli, value: 7 }
                      - { label: August, value: 8 }
                      - { label: September, value: 9 }
                      - { label: Oktober, value: 10 }
                      - { label: November, value: 11 }
                      - { label: Dezember, value: 12 }
                  - { name: title, label: Titel, widget: string }
                  - { name: body, label: Text, widget: string, required: false }
              - name: summer
                label: Sommerreifen
                widget: object
                fields:
                  - { name: months, label: Monate, widget: select, multiple: true, required: false, options: *months }
                  - { name: title, label: Titel, widget: string }
                  - { name: body, label: Text, widget: string, required: false }

          - name: contact
            label: Kontakt
            widget: object
            hint: 'Erscheint in Kopfzeile, Fusszeile, Kontaktseite, Impressum und Datenschutz.'
            fields:
              - { name: mobile, label: Telefon Mobile, widget: string, pattern: ['^\+?[0-9 ]{9,}$', 'Nur Ziffern und Leerzeichen, z.B. 079 681 64 68'] }
              - { name: landline, label: Telefon Festnetz, widget: string, pattern: ['^\+?[0-9 ]{9,}$', 'Nur Ziffern und Leerzeichen, z.B. 062 844 20 20'] }
              - { name: email, label: E-Mail, widget: string }
